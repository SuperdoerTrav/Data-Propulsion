[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssa-data-propulsion"
version = "0.0.3"
description = "Source-attributed SSA propulsion and launch reference data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"]}}
include-package-data = true

[tool.setuptools.package-data]
ssa_data_propulsion = ["data/**/*", "data/*"]
ssa_data_launch = ["data/**/*.json", "data/**/*.csv", "data/**/*.dml"]
